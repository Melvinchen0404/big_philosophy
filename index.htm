<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline of the Universe</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#04050f;
  --bg2:#080a1a;

  --nebula1:#312e81;
  --nebula2:#0f172a;

  --gold:#fbbf24;
  --gold-light:#fde68a;

  --cyan:#38bdf8;
  --purple:#a78bfa;
  --red:#fb7185;
  --green:#4ade80;

  --text:#f8fafc;
  --text-dim:#94a3b8;

  --border:rgba(255,255,255,0.08);
  --card-bg:rgba(15,23,42,0.88);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Cormorant Garamond',serif;
  background:
    radial-gradient(circle at top left, rgba(15,120,120,0.12), transparent 40%),
    radial-gradient(circle at bottom right, rgba(20,180,170,0.10), transparent 40%),
    var(--bg);
  color:var(--text);
  overflow-x:hidden;
  min-height:100vh;
}

/* Starfield */

#starfield{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* Nebula */

.nebula-blob{
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  opacity:0.16;
  pointer-events:none;
  z-index:1;
}

header{
  position:relative;
  z-index:10;
  text-align:center;
  padding:70px 20px 50px;
  background:linear-gradient(to bottom, rgba(2,20,20,0.98), transparent);
}

header h1{
  font-size:clamp(2.5rem,6vw,5rem);
  font-weight:300;
  letter-spacing:0.12em;
  color:var(--gold-light);
  margin-bottom:14px;
  text-shadow:0 0 40px rgba(199,255,243,0.15);
}

header p{
  font-family:'Space Mono',monospace;
  font-size:0.75rem;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--text-dim);
}

/* Trivia */

.trivia-box{
  margin-top:36px;
  padding:24px;
  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      rgba(251,191,36,0.08),
      rgba(255,255,255,0.02)
    );

  border:1px solid rgba(251,191,36,0.18);

  position:relative;
  overflow:hidden;
}

.trivia-box::before{
  content:"FUN FACT";
  position:absolute;
  top:12px;
  right:16px;

  font-family:'Space Mono',monospace;
  font-size:0.55rem;
  letter-spacing:0.18em;

  color:rgba(255,255,255,0.25);
}

.trivia-title{
  color:var(--gold-light);
  font-size:1.15rem;
  margin-bottom:12px;
}

.trivia-text{
  line-height:1.8;
  color:var(--text);
  font-size:1rem;
}

/* Era bar */

.era-bar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  overflow-x:auto;
  backdrop-filter:blur(12px);
  background:rgba(2,20,20,0.92);
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}

.era-bar::-webkit-scrollbar{
  display:none;
}

.era-btn{
  border:none;
  background:none;
  color:var(--text-dim);
  padding:16px 22px;
  cursor:pointer;
  white-space:nowrap;
  transition:0.25s;
  font-family:'Space Mono',monospace;
  font-size:0.65rem;
  letter-spacing:0.16em;
  text-transform:uppercase;
}

.era-btn:hover{
  color:var(--gold-light);
  background:rgba(255,255,255,0.03);
}

.layout{
  display:flex;
  position:relative;
  z-index:5;
}

/* Sidebar */

.timeline-col{
  width:300px;
  flex-shrink:0;
  height:calc(100vh - 50px);
  overflow-y:auto;
  position:sticky;
  top:50px;
  border-right:1px solid var(--border);
  padding:20px 0;
}

.timeline-col::-webkit-scrollbar{
  width:5px;
}

.timeline-col::-webkit-scrollbar-thumb{
  background:var(--border);
}

.era-section-label{
  font-family:'Space Mono',monospace;
  font-size:0.55rem;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:var(--text-dim);
  padding:20px 24px 10px;
  border-top:1px solid var(--border);
}

.timeline-item{
  display:flex;
  gap:12px;
  padding:12px 24px;
  cursor:pointer;
  transition:0.2s;
  position:relative;
}

.timeline-item:hover{
  background:rgba(255,255,255,0.03);
}

.timeline-item.active{
  background:rgba(143,211,193,0.08);
}

.timeline-item.active::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--gold);
}

.item-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  margin-top:6px;
  flex-shrink:0;
}

.item-date{
  font-family:'Space Mono',monospace;
  font-size:0.58rem;
  color:var(--gold);
  margin-bottom:3px;
}

.item-title{
  font-size:0.95rem;
  line-height:1.3;
}

/* Main content */

.detail-panel{
  flex:1;
  padding:50px 60px;
  max-width:900px;
}

.detail-content{
  animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.detail-era{
  display:inline-block;
  padding:6px 12px;
  border-radius:4px;
  margin-bottom:20px;
  font-family:'Space Mono',monospace;
  font-size:0.6rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
}

.detail-date{
  font-family:'Space Mono',monospace;
  color:var(--gold);
  letter-spacing:0.08em;
  margin-bottom:12px;
}

.detail-title{
  font-size:clamp(2rem,4vw,3rem);
  font-weight:300;
  color:var(--gold-light);
  margin-bottom:24px;
}

.detail-visual{
  height:220px;
  margin-bottom:32px;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.02);
}

.detail-body{
  font-size:1.12rem;
  line-height:1.9;
}

.detail-body p + p{
  margin-top:18px;
}

.detail-facts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-top:36px;
}

.fact-card{
  padding:18px;
  border-radius:8px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
}

.fact-label{
  font-family:'Space Mono',monospace;
  font-size:0.55rem;
  text-transform:uppercase;
  letter-spacing:0.18em;
  color:var(--text-dim);
  margin-bottom:8px;
}

.fact-value{
  color:var(--gold-light);
  font-size:1rem;
  font-weight:600;
}

.fact-sub{
  margin-top:4px;
  font-size:0.85rem;
  color:var(--text-dim);
}

.nav{
  display:flex;
  gap:14px;
  margin-top:40px;
}

.nav button{
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 18px;
  cursor:pointer;
  border-radius:4px;
  transition:0.2s;
  font-family:'Space Mono',monospace;
  font-size:0.65rem;
}

.nav button:hover{
  border-color:var(--gold);
  color:var(--gold-light);
}

@media(max-width:900px){

  .layout{
    flex-direction:column;
  }

  .timeline-col{
    width:100%;
    height:auto;
    position:relative;
    top:0;
    border-right:none;
    border-bottom:1px solid var(--border);
  }

  .detail-panel{
    padding:30px 20px;
  }
}
</style>
</head>

That ancient light still fills the universe today as the Cosmic Microwave Background radiation.`,

trivia:`<b>Pop III stars: live fast, burn bright, die as a supernova</b><br> When the universe had cooled sufficiently, the first stars were born as population III stars. Pop III stars had a critical handicap: they were made of almost pure hydrogen and helium, with no heavier elements at all. This matters because heavier elements act as a coolant in collapsing gas clouds, regulating how fast and how big stars grow. Without them, the gas clouds collapsed almost unchecked.\n\nThe result was stars of staggering size — theoretically 100 to 1,000 times the mass of our Sun,flooding the universe with ultraviolet radiation and burning swiftly through their fuel in a few million years. At their deaths, explosions seeded the universe with everything needed to build planets, chemistry, and (eventually) life. Every carbon atom in our bodies was forged inside a dying star, likely one of these giants.`,

const eraBar = document.getElementById('eraBar');
const timelineCol = document.getElementById('timelineCol');
const detailContent = document.getElementById('detailContent');

ERAS.forEach(era => {

  const btn = document.createElement('button');
  btn.className = 'era-btn';
  btn.innerText = era.label;
  btn.onclick = () => {
    document.getElementById('era-' + era.id)
      .scrollIntoView({behavior:'smooth'});
  };
  eraBar.appendChild(btn);

  const label = document.createElement('div');
  label.className = 'era-section-label';
  label.id = 'era-' + era.id;
  label.innerText = era.label;
  timelineCol.appendChild(label);

  EVENTS.filter(e => e.era === era.id).forEach((event,index)=>{

    const item = document.createElement('div');
    item.className = 'timeline-item';

    item.innerHTML = `
      <div class="item-dot"
      style="background:${event.color};
      box-shadow:0 0 12px ${event.color}">
      </div>

      <div>
        <div class="item-date">${event.date}</div>
        <div class="item-title">${event.title}</div>
      </div>
    `;

    item.onclick = () => showEvent(event,item);

    timelineCol.appendChild(item);

    if(index === 0 && era.id === 'cosmic'){
      showEvent(event,item);
    }

  });

});

function showEvent(event,el){

  document.querySelectorAll('.timeline-item')
    .forEach(i => i.classList.remove('active'));

  if(el){
    el.classList.add('active');
  }

  detailContent.innerHTML = `
    <div class="detail-content">

      <div class="detail-era"
      style="
      background:${event.color}22;
      color:${event.color};
      border:1px solid ${event.color}44">
      ${ERAS.find(e => e.id === event.era).label}
      </div>

      <div class="detail-date">${event.date}</div>

      <div class="detail-title">${event.title}</div>

      <div class="detail-visual">
        ${generateVisual(event.color)}
      </div>

      <div class="detail-body">
        ${event.body
          .split('\\n\\n')
          .map(p => `<p>${p}</p>`)
          .join('')}
      </div>

      <div class="detail-facts">
        ${event.facts.map(f => `
          <div class="fact-card">
            <div class="fact-label">${f.label}</div>
            <div class="fact-value">${f.value}</div>
            <div class="fact-sub">${f.sub}</div>
          </div>
        `).join('')}
      </div>
${event.trivia ? `
  <div class="trivia-box">

    <div class="trivia-title">
     Did You Know?
    </div>

    <div class="trivia-text">
      ${event.trivia}
    </div>

  </div>
` : ''}

    </div>
  `;
}

function generateVisual(color){

  return `
  <svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <radialGradient id="g">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#021414" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="600" height="220" fill="#021414"/>

    <circle cx="300" cy="110" r="90" fill="url(#g)"/>

    ${
      [...Array(60)].map(()=>`
      <circle
      cx="${Math.random()*600}"
      cy="${Math.random()*220}"
      r="${Math.random()*2}"
      fill="white"
      opacity="${0.1 + Math.random()*0.8}"/>
      `).join('')
    }

  </svg>
  `;
}

/* Starfield */

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');

let stars = [];

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function createStars(){

  stars = [];

  for(let i=0;i<220;i++){

    stars.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*1.6,
      a:Math.random(),
      s:0.2 + Math.random()*0.6
    });
  }
}

function animate(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  stars.forEach(star=>{

    star.y += star.s * 0.03;

    if(star.y > canvas.height){
      star.y = 0;
      star.x = Math.random()*canvas.width;
    }

    ctx.beginPath();
    ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${star.a})`;
    ctx.fill();

  });

  requestAnimationFrame(animate);
}

resize();
createStars();
animate();

window.addEventListener('resize',()=>{
  resize();
  createStars();
});

</script>
